name: CI / CD Pipeline - PDF Insight

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-and-test:
    name: Lint, Type check & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint, no any / no console)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Lint OpenAPI spec (Redocly)
        run: npm run openapi:lint

      - name: Type check (TypeScript strict)
        run: npm run typecheck

      - name: Run Vitest Suite (Unit, Validation, Security)
        run: npm test

  build-and-deploy:
    name: Build & Deploy to GitHub Pages
    needs: lint-and-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify backend URL is configured
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::warning::Repository variable VITE_API_URL is not set yet. SPA will deploy with built-in reference analysis and demo capabilities."
          fi

      - name: Build SPA Bundle
        env:
          VITE_BASE_PATH: '/${{ github.event.repository.name }}/'
          # Public URL of the backend proxy (not a secret – the API key lives only in the Worker)
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
