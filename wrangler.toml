# Cloudflare Worker – backend proxy for PDF Insight.
# Deploy:  npx wrangler deploy
# Secret:  npx wrangler secret put OPENROUTER_API_KEY   (NEVER put the key in this file)
name = "pdf-insight-proxy"
main = "api/worker.ts"
compatibility_date = "2025-01-01"

[vars]
ALLOWED_ORIGINS = "https://ptymek.github.io,http://localhost:5173"
# Primary free model + fallbacks (OpenRouter "models" routing), comma-separated, max 3
OPENROUTER_MODEL = "nvidia/nemotron-3.5-super-vl:free,google/gemma-4-31b-it:free,google/gemma-4-26b-a4b-it:free"
OPENROUTER_TIMEOUT_MS = "90000"
RATE_LIMIT_PER_MINUTE = "10"
